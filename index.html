<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pressé — the nail edit</title>

  <!-- progressive enhancement: the page is a static stack until JS upgrades it -->
  <script>document.documentElement.classList.add('js');</script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500&display=swap"
    rel="stylesheet">

  <link rel="preload" as="image" href="assets/images/nail_hero.jpg">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cinematic.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

  <!-- Branded preloader — holds the viewport until the hero photo is ready -->
  <div id="preloader">
    <span class="preloader__word">pressé</span>
  </div>

  <main class="cinematic is-static">
    <section class="cinematic__stage" aria-label="pressé — the nail edit">

      <!-- SCROLL-CONTROLLED VIDEO (desktop / fine-pointer only): the scroll
           position scrubs currentTime frame-by-frame. No autoplay, no controls. -->
      <video class="cinematic__video" aria-hidden="true" src="assets/videos/nail_video.mp4" muted playsinline
        preload="auto" disablepictureinpicture></video>

      <!-- Fallback photograph for touch devices / no-JS / reduced-motion.
           On mobile the scroll zooms this in; two copies (sharp + pre-blurred)
           make the abstraction a GPU-cheap opacity crossfade. -->
      <figure class="cinematic__photo is-wide">
        <img class="is-sharp" src="assets/images/nail_hero.jpg"
          alt="A pair of hands with glossy nude almond press-on nails" decoding="async">
        <img class="is-blur" src="assets/images/nail_hero.jpg" alt="" aria-hidden="true" decoding="async">
      </figure>

      <!-- Cream veil at rest; the timeline also re-uses it as the nude wash
           that fills the screen during the invisible photo -> illustration swap -->
      <div class="cinematic__veil" aria-hidden="true"></div>

      <!-- Illustrated fingertip + nail — the product blueprint.
           The whole figure floats + drifts toward the cursor (see cinematic.js). -->
      <div class="cinematic__figure">

        <!-- soft floating drop-shadow beneath the illustration -->
        <div class="cinematic__nail-shadow" aria-hidden="true"></div>

        <img class="cinematic__nail" src="assets/images/nailcloseup.png"
          alt="Close-up of a glossy nude almond press-on nail" decoding="async">

        <!-- Annotation arrows — one source image (assets/images/curlyarrow1.svg),
             tinted to --muted and re-oriented per annotation in js/cinematic.js -->
        <div class="cinematic__arrows" aria-hidden="true">
          <span class="annotation__arrow ar0" data-i="0"></span>
          <span class="annotation__arrow ar1" data-i="1"></span>
          <span class="annotation__arrow ar2" data-i="2"></span>
          <span class="annotation__arrow ar3" data-i="3"></span>
        </div>

        <!-- Annotation labels — text lives here so it is easy to edit -->
        <div class="cinematic__annotations">
          <div class="annotation__text a0" data-i="0">
            <p class="annotation__label">BIAB Base</p>
            <p class="annotation__desc">A strong structured base for durability</p>
          </div>
          <div class="annotation__text a1" data-i="1">
            <p class="annotation__label">High-shine Finish</p>
            <p class="annotation__desc">A glossy salon-inspired finish</p>
          </div>
          <div class="annotation__text a2" data-i="2">
            <p class="annotation__label">Precision Shape</p>
            <p class="annotation__desc">Carefully shaped for a refined look</p>
          </div>
          <div class="annotation__text a3" data-i="3">
            <p class="annotation__label">Durable Design</p>
            <p class="annotation__desc">Built to withstand everyday wear</p>
          </div>
        </div>
      </div>

      <!-- Intro overlay: wordmark floating in a soft cream vignette over the photo -->
      <div class="cinematic__intro">
        <div class="cinematic__intro-glow" aria-hidden="true"></div>
        <div class="cinematic__intro-inner">
          <img class="cinematic__logo" src="logo/presse_transparent.svg" alt="pressé">
          <p class="cinematic__tagline">the nail edit</p>
        </div>
      </div>

      <!-- Scroll hint -->
      <div class="cinematic__hint" aria-hidden="true">
        <span class="cinematic__hint-word">scroll</span>
        <span class="cinematic__hint-chevron"></span>
      </div>

    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/cinematic.js"></script>
</body>

</html>
